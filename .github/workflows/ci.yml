name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alumni
          POSTGRES_PASSWORD: alumni
          POSTGRES_DB: alumni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alumni" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://alumni:alumni@localhost:5432/alumni_test
      E2E_DATABASE_URL: postgres://alumni:alumni@localhost:5432/alumni_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @alumni/web build
      - name: Create e2e database
        run: PGPASSWORD=alumni psql -h localhost -U alumni -d alumni_test -c 'CREATE DATABASE alumni_e2e'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
